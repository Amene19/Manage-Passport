services:
  - type: web
    name: passport-management-backend
    runtime: node
    plan: free
    buildCommand: cd Backend && npm install && npm install ts-node -g && npm install typescript
    startCommand: cd Backend && npx ts-node src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
