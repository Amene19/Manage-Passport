services:
  - type: web
    name: passport-management-backend
    runtime: node
    plan: free
    buildCommand: chmod +x render-build-config.sh && ./render-build-config.sh && cd Backend && npm install && npm run build
    startCommand: cd Backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h 