services:
  - type: web
    name: passport-management-backend
    runtime: node
    plan: free
    buildCommand: cd Backend && npm install typescript && npm install && echo '{"compilerOptions":{"target":"es2018","module":"commonjs","lib":["es2018","esnext.asynciterable","dom"],"outDir":"./dist","rootDir":"./src","strict":false,"esModuleInterop":true,"skipLibCheck":true,"forceConsistentCasingInFileNames":true,"moduleResolution":"node","resolveJsonModule":true,"noImplicitAny":false},"include":["src/**/*"],"exclude":["node_modules","dist"]}' > tsconfig.json && npm run build
    startCommand: cd Backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h 